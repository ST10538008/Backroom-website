<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Backroom | Enquiry</title>
    </head>

    <body>
        <!-- Header -->
        <header>
            <h1>Backroom</h1>

            <!-- Main Navigation -->
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="rentals.html">Rentals</a>
                <a href="enquiry.html">Enquiry</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>


        <!-- Main Content -->
        <main>
            <section>
                <h2>Rental Enquiry</h2>

                <p>
                    Interested in one of our rental properties?
                    Complete the form below to make an enquiry.
                </p>
            </section>


            <!-- Enquiry Form -->
            <section>
                <form>
                    <!-- Name -->
                    <label for="name">
                        Full Name:
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                    >

                    <br><br>

                    <!-- Email -->
                    <label for="email">
                        Email Address:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                    >

                    <br><br>

                    <!-- Phone -->
                    <label for="phone">
                        Phone Number:
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                    >

                    <br><br>

                    <!-- Area -->
                    <label for="area">
                        Preferred Area:
                    </label>

                    <select id="area" name="area">
                        <option value="">
                            Select an area
                        </option>

                        <option value="umlazi">
                            Umlazi
                        </option>

                        <option value="kwamashu">
                            KwaMashu
                        </option>

                        <option value="other">
                            Inanda
                        </option>
                    </select>

                    <br><br>

                    <!-- Property Type -->
                    <label for="rental-type">
                        Rental Type:
                    </label>

                    <select id="rental-type" name="rental-type">
                        <option value="">
                            Select rental type
                        </option>

                        <option value="single">
                            Single Backroom
                        </option>

                        <option value="two-room">
                            Two-Room Unit
                        </option>

                        <option value="family-house">
                            Family House
                        </option>
                    </select>

                    <br><br>

                    <!-- Budget -->
                    <label for="budget">
                        Monthly Budget:
                    </label>

                    <input
                        type="number"
                        id="budget"
                        name="budget"
                    >

                    <br><br>

                    <!-- Move-in Date -->
                    <label for="move-in">
                        Preferred Move-in Date:
                    </label>

                    <input
                        type="date"
                        id="move-in"
                        name="move-in"
                    >

                    <br><br>

                    <!-- Message -->
                    <label for="message">
                        Message:
                    </label>

                    <br>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                    ></textarea>

                    <br><br>

                    <!-- Submit -->
                    <button type="submit">
                        Submit Enquiry
                    </button>
                </form>
            </section>

        </main>


        <!-- Footer -->
        <footer>

            <p>
                &copy; 2026 Backroom. All rights reserved.
            </p>

        </footer>

    </body>

</html>
