<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">

        <!-- Allows the page to adjust to different screen sizes -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Backroom | Enquiry</title>

        <!-- Links the page to the main CSS stylesheet -->
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <!-- Header containing the website name and navigation -->
        <header>
            <h1>Backroom</h1>

            <!-- Main Navigation allows users to move between website pages -->
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="rentals.html">Rentals</a>
                <a href="enquiry.html">Enquiry</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>


        <!-- Main Content -->
        <main>

            <!-- Introduction explains the purpose of the enquiry form -->
            <section>
                <h2>Rental Enquiry</h2>

                <p>
                    Interested in one of our rental properties?
                    Complete the form below to make an enquiry.
                </p>
            </section>


            <!-- Enquiry Form collects information from users interested in a rental -->
            <section>
                <form>

                    <!-- Text input is used to collect the user's full name -->
                    <label for="name">
                        Full Name:
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                    >

                    <br><br>


                    <!-- Email input allows the user to enter an email address -->
                    <label for="email">
                        Email Address:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                    >

                    <br><br>


                    <!-- Telephone input is used for the user's contact number -->
                    <label for="phone">
                        Phone Number:
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                    >

                    <br><br>


                    <!-- Dropdown allows the user to select a preferred rental area -->
                    <label for="area">
                        Preferred Area:
                    </label>

                    <select id="area" name="area">
                        <option value="">
                            Select an area
                        </option>

                        <option value="umlazi">
                            Umlazi
                        </option>

                        <option value="kwamashu">
                            KwaMashu
                        </option>

                        <option value="other">
                            Inanda
                        </option>
                    </select>

                    <br><br>


                    <!-- Dropdown allows the user to select the type of property -->
                    <label for="rental-type">
                        Rental Type:
                    </label>

                    <select id="rental-type" name="rental-type">
                        <option value="">
                            Select rental type
                        </option>

                        <option value="single">
                            Single Backroom
                        </option>

                        <option value="two-room">
                            Two-Room Unit
                        </option>

                        <option value="family-house">
                            Family House
                        </option>
                    </select>

                    <br><br>


                    <!-- Number input is used for the user's monthly rental budget -->
                    <label for="budget">
                        Monthly Budget:
                    </label>

                    <input
                        type="number"
                        id="budget"
                        name="budget"
                    >

                    <br><br>


                    <!-- Date input allows the user to select a preferred move-in date -->
                    <label for="move-in">
                        Preferred Move-in Date:
                    </label>

                    <input
                        type="date"
                        id="move-in"
                        name="move-in"
                    >

                    <br><br>


                    <!-- Textarea provides a larger space for additional information -->
                    <label for="message">
                        Message:
                    </label>

                    <br>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                    ></textarea>

                    <br><br>


                    <!-- Submit button allows the user to send the enquiry -->
                    <button type="submit">
                        Submit Enquiry
                    </button>

                </form>
            </section>

        </main>


        <!-- Footer containing copyright information and a contact link -->
        <footer>

            <p>
                &copy; 2026 Backroom. All rights reserved.
            </p>

            <!-- Provides another way to access the Contact page -->
            <p>
                <a href="contact.html">Contact Us</a>
            </p>

        </footer>

    </body>

</html>
